{{define "experimente/page"}}
<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.PageTitle}}</title>
    <link rel="stylesheet" href="/assets/index.css">
    <script defer src="/assets/htmx.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Hauptnavigation">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <span>agent<span class="brand-light">control</span><small>CONTROL PLANE</small></span>
        </a>
        <div class="side-label nav-label">NAVIGATION</div>
        <nav>
          {{range .Navigation}}
            <a class="nav-item {{if eq .Key "experimente"}}active{{end}}" href="{{.Href}}" {{if eq .Key "experimente"}}aria-current="page"{{end}}>
              <span class="nav-icon" aria-hidden="true">{{.Icon}}</span>{{.Label}}
            </a>
          {{end}}
        </nav>
      </aside>
      <div class="main-wrap">
        <header class="topbar">
          <div class="breadcrumb">Arbeitsbereich <span>/</span> <strong>Experimente</strong></div>
          <div class="top-actions"><span class="avatar-user" aria-label="Lokaler Betreiber">B</span></div>
        </header>
        <main id="content" class="content" tabindex="-1">
          {{template "experimente/content" .}}
        </main>
      </div>
    </div>
  </body>
</html>
{{end}}
