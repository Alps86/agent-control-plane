{{define "agenten/codexprofil/page"}}
<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.PageTitle}}</title>
    <link rel="stylesheet" href="/assets/index.css">
    <script defer src="/assets/htmx.min.js"></script>
    <script>
      document.addEventListener('htmx:beforeSwap', event => {
        if (event.detail.xhr.status === 422 && event.detail.target.id === 'content') {
          event.detail.shouldSwap = true;
          event.detail.isError = false;
        }
      });
    </script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Hauptnavigation">
        <a class="brand" href="/organisationen"><span class="brand-mark">✳</span><span>agent<span class="brand-light">control</span><small>CONTROL PLANE</small></span></a>
        <div class="side-label nav-label">NAVIGATION</div>
        <nav>
          {{range .Navigation}}
            <a class="nav-item" href="{{.Href}}"><span class="nav-icon" aria-hidden="true">{{.Icon}}</span>{{.Label}}</a>
          {{end}}
        </nav>
      </aside>
      <div class="main-wrap">
        <header class="topbar"><div class="breadcrumb">Arbeitsbereich <span>/</span> <strong>{{.PageTitle}}</strong></div></header>
        <main id="content" class="content" tabindex="-1">{{template "agenten/codexprofil/content" .}}</main>
      </div>
    </div>
    <script>
      document.addEventListener('click', async event => {
        const button = event.target.closest('#codex-profile-check');
        if (!button) return;
        const result = document.getElementById('codex-profile-check-result');
        button.disabled = true;
        result.textContent = 'Profilprüfung läuft …';
        try {
          const response = await fetch(button.dataset.url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: '{}'
          });
          const report = await response.json();
          result.textContent = response.ok
            ? `${report.ready ? 'Startbereit' : 'Nicht startbereit'}: ${report.reason}`
            : `Profilprüfung fehlgeschlagen: ${report.error || response.status}`;
        } catch {
          result.textContent = 'Profilprüfung derzeit nicht verfügbar.';
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
{{end}}
