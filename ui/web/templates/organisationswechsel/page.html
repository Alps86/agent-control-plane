{{define "organisationswechsel/page"}}
<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.PageTitle}}</title>
    <link rel="stylesheet" href="/assets/index.css">
    <script src="/assets/htmx.min.js" defer></script>
    <script>
      document.addEventListener('htmx:beforeSwap', function (event) {
        if (event.detail.target.id === 'content' && event.detail.xhr.status >= 400 && event.detail.xhr.status < 500) {
          event.detail.shouldSwap = true;
          event.detail.isError = false;
        }
      });
    </script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Hauptnavigation">
        <a class="brand" href="/organisationswechsel"><span class="brand-mark">✳</span><span>agent<span class="brand-light">control</span><small>CONTROL PLANE</small></span></a>
        <div class="side-label nav-label">NAVIGATION</div>
        <nav><a class="nav-item" href="/organisationswechsel">Organisationen</a></nav>
      </aside>
      <div class="main-wrap">
        <header class="topbar"><div class="breadcrumb">Arbeitsbereich <span>/</span> <strong>{{.PageTitle}}</strong></div></header>
        <main id="content" class="content" tabindex="-1">{{template "organisationswechsel/content" .}}</main>
      </div>
    </div>
  </body>
</html>
{{end}}
